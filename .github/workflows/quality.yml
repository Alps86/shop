name: Quality
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
env:
  QLTY_VERSION: '0.651.0'
  SHOP_BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
  SHOP_PERFORMANCE_PUBLIC_URL: http://127.0.0.1:28080
  SHOP_PERFORMANCE_BACKEND_URL: http://127.0.0.1:28081
  SHOP_PERFORMANCE_INTERNAL_URL: http://127.0.0.1:28090
  SHOP_PERFORMANCE_POSTGRES_DSN: postgres://shop:local-demo-only@127.0.0.1:25432/shop?sslmode=disable
  SHOP_PERFORMANCE_SCHEMA: demo_benchmark
  SHOP_PERFORMANCE_TEMPORAL_ADDRESS: 127.0.0.1:27233
  SHOP_PERFORMANCE_OPENSEARCH_URL: http://127.0.0.1:29200
  SHOP_PERFORMANCE_SEARCH_INDEX: shop-benchmark
  SHOP_PERFORMANCE_TASK_QUEUE: demo_benchmark
  SHOP_PERFORMANCE_COMPOSE_PROJECT: shop-benchmark
  SHOP_PERFORMANCE_REPORT_DIRECTORY: /tmp/shop-benchmark-results
  SHOP_PERFORMANCE_STATE_FILE: /tmp/shop-benchmark-private-state.json
  SHOP_PERFORMANCE_IMAGES: postgres16.15,temporal1.9.1,opensearch3.9.0,go1.26.9,hugo0.168.0,nginx1.30.6,varnish9.1.0; digests in compose.yml
  SHOP_HEY: /tmp/shop-standard-tools/hey
jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Qlty installieren
        run: curl -fsSL https://qlty.sh | bash
      - name: Qlty-Konfiguration und Standardchecks
        run: |
          export PATH="$HOME/.qlty/bin:$PATH"
          qlty config validate
          qlty check --all --no-cache --no-fix
      - name: Smells und Metrics als vollständige Qualitätsnachweise
        run: |
          export PATH="$HOME/.qlty/bin:$PATH"
          qlty smells --all --json > /tmp/smells.json
          jq -e 'length == 0' /tmp/smells.json
          qlty metrics --all --functions --json > /tmp/metrics.json
          qlty metrics --all --dirs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deklarative AST-Regeltests mit Standardwerkzeug
        run: npm exec --yes --package=@ast-grep/cli@0.40.0 -- ast-grep test --skip-snapshot-tests
      - name: Tatsächlichen PR-Diff prüfen
        run: git diff --check "$SHOP_BASE_SHA...HEAD"
      - uses: actions/upload-artifact@v4
        with:
          name: qlty-smells-and-metrics
          path: |
            /tmp/smells.json
            /tmp/metrics.json
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go build ./...
      - name: Tatsächlich vorhandene Standardtestanbindung übersetzen
        run: go test ./... -run '^$' -count=1
  cucumber-and-coverage:
    name: cucumber-and-coverage
    runs-on: ubuntu-latest
    env:
      SHOP_TEST_POSTGRES_DSN: postgres://shop:local-demo-only@127.0.0.1:15432/shop?sslmode=disable
      SHOP_TEST_TEMPORAL_ADDRESS: 127.0.0.1:17233
      TEMPORAL_ADDRESS: 127.0.0.1:17233
      SHOP_TEST_OPENSEARCH_URL: http://127.0.0.1:19200
      SHOP_PROCESS_COVERDIR: /tmp/shop-native-coverage
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Echte Hugo-/SSI-/ESI-Standardengines installieren
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends hugo nginx varnish sysstat
          hugo version
          nginx -v
          varnishd -V
      - name: Standardlastwerkzeug installieren
        run: GOBIN=/tmp/shop-standard-tools go install github.com/rakyll/hey@v0.1.5
      - name: Tatsächliche Compose-Laufzeit starten
        run: |
          mkdir -p /tmp/shop-benchmark-results
          started=$SECONDS
          docker compose up --detach --build --wait --wait-timeout 180
          elapsed=$((SECONDS - started))
          printf '{"boundary":"compose-command-start-to-all-services-healthy","seconds":%s,"resolutionSeconds":1,"includes":"image pull, build, content generation, seed import, health waits","freshProjectVolumes":true,"dataset":"4 Modelle / 8 Varianten","ordersAtStartup":0,"buildCache":"first build","fullPageRequestMeasurement":false}\n' "$elapsed" > /tmp/shop-benchmark-results/demo-cold-start.json
      - name: Isoliertes synthetisches Referenzprofil mit gleichem Build starten
        run: |
          mkdir -p /tmp/shop-benchmark-results
          started=$SECONDS
          docker compose -p shop-benchmark -f compose.yml -f compose.benchmark.yml up --detach --build --wait --wait-timeout 180
          elapsed=$((SECONDS - started))
          printf '{"boundary":"compose-command-start-to-all-services-healthy","seconds":%s,"resolutionSeconds":1,"includes":"image pull, build, content generation, seed import, health waits","freshProjectVolumes":true,"dataset":"30 synthetische Modelle / 90 Varianten","ordersAtStartup":0,"buildCache":"shared image build cache from demo","fullPageRequestMeasurement":false}\n' "$elapsed" > /tmp/shop-benchmark-results/benchmark-cold-start.json
      - name: Beobachtende Ressourcenzeitreihen für beide eigenen Projekte starten
        run: |
          mkdir -p /tmp/shop-benchmark-results/resources
          docker compose ps -aq > /tmp/shop-diagnostic-containers
          docker compose -p shop-benchmark -f compose.yml -f compose.benchmark.yml ps -aq >> /tmp/shop-diagnostic-containers
          sort -u /tmp/shop-diagnostic-containers -o /tmp/shop-diagnostic-containers
          mapfile -t containers < /tmp/shop-diagnostic-containers
          setsid bash -c "docker stats --format '{{json .}}' \"\$@\" | while IFS= read -r sample; do printf '{\"utc\":\"%s\",\"sample\":%s}\\n' \"\$(date --utc --iso-8601=ns)\" \"\$sample\"; done" collector "${containers[@]}" > /tmp/shop-benchmark-results/resources/container-stats.jsonl 2> /tmp/shop-benchmark-results/resources/container-stats.stderr &
          echo "$!" > /tmp/shop-stats.pid
          setsid docker events --filter type=container --filter label=com.docker.compose.project=shop --format '{{json .}}' > /tmp/shop-benchmark-results/resources/demo-events.jsonl 2> /tmp/shop-benchmark-results/resources/demo-events.stderr &
          echo "$!" > /tmp/shop-demo-events.pid
          setsid docker events --filter type=container --filter label=com.docker.compose.project=shop-benchmark --format '{{json .}}' > /tmp/shop-benchmark-results/resources/benchmark-events.jsonl 2> /tmp/shop-benchmark-results/resources/benchmark-events.stderr &
          echo "$!" > /tmp/shop-benchmark-events.pid
          setsid timeout 1500s pidstat -H -h -r -u -p ALL 1 > /tmp/shop-benchmark-results/resources/host-processes.txt 2> /tmp/shop-benchmark-results/resources/host-processes.stderr &
          echo "$!" > /tmp/shop-host-processes.pid
          ps -eo pid,ppid,comm > /tmp/shop-benchmark-results/resources/process-tree-before.txt
          printf 'pidstat -H: UTC Unixzeit; CPU100 entspricht einem Kern. Nur Prozessnamen, keine Argumente. PPID-Zuordnung aus separaten Snapshots; kurze Prozesse und Samplinglücken bleiben unbelegt. Beobachtung läuft in beiden Phasen und verursacht Aufwand.\n' > /tmp/shop-benchmark-results/resources/host-process-boundary.txt
          printf 'Mitlaufende Standard-Dockerbeobachtung verursacht zusätzlichen Diagnoseaufwand. UTC je Statszeile ist Empfangszeit, kein exakter CPU-Intervallbeginn. Snapshots vor/nach der gesamten Suite erlauben keine isolierte Routenzuordnung. Fehlende Dateien/Fehler sind fehlende Diagnosen, keine Nullwerte.\n' > /tmp/shop-benchmark-results/resources/measurement-boundary.txt
      - name: Vor Tests echte Ressourcen- und Dienstzustände sichern
        if: always()
        run: |
          directory=/tmp/shop-benchmark-results/resources/vor
          mkdir -p "$directory"
          date --utc --iso-8601=ns > "$directory/utc.txt"
          docker info --format '{"cpu":{{.NCPU}},"memoryBytes":{{.MemTotal}},"kernel":{{json .KernelVersion}},"os":{{json .OperatingSystem}}}' > "$directory/docker-host.json"
          free --bytes > "$directory/host-memory.txt"
          for pressure in cpu memory io; do
            cat "/proc/pressure/$pressure" > "$directory/host-$pressure-pressure.txt" 2>&1 || printf 'Nicht verfügbare Hostdiagnose: %s\n' "$pressure" >> "$directory/unavailable.txt"
          done
          docker compose ps -aq > /tmp/shop-diagnostic-current
          docker compose -p shop-benchmark -f compose.yml -f compose.benchmark.yml ps -aq >> /tmp/shop-diagnostic-current
          sort -u /tmp/shop-diagnostic-current -o /tmp/shop-diagnostic-current
          while read -r container; do
            docker inspect --format '{"id":{{json .Id}},"name":{{json .Name}},"status":{{json .State.Status}},"oomKilled":{{.State.OOMKilled}},"restarts":{{.RestartCount}},"exitCode":{{.State.ExitCode}},"health":{{json (index .State "Health")}},"started":{{json .State.StartedAt}},"finished":{{json .State.FinishedAt}},"nanoCPUs":{{.HostConfig.NanoCpus}},"cpuQuota":{{.HostConfig.CpuQuota}},"cpuPeriod":{{.HostConfig.CpuPeriod}},"memoryLimit":{{.HostConfig.Memory}}}' "$container" > "$directory/$container-state.json"
            process=$(docker inspect --format '{{.State.Pid}}' "$container")
            if [ "$process" -gt 0 ]; then
              for metric in cpu.stat memory.events memory.current memory.peak cpu.pressure memory.pressure; do
                if ! captured=$(sudo cat "/proc/$process/root/sys/fs/cgroup/$metric" 2>&1); then
                  printf 'Nicht verfügbare Containerdiagnose: %s/%s\n' "$container" "$metric" >> "$directory/unavailable.txt"
                fi
                printf '%s\n' "$captured" > "$directory/$container-$metric.txt"
              done
            fi
          done < /tmp/shop-diagnostic-current
          for port in 19200 29200; do
            curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:$port/_nodes/stats/indices,jvm,process,os,thread_pool" > "$directory/opensearch-$port-nodes.json" 2> "$directory/opensearch-$port-nodes.stderr" || printf 'OSnodes %s nicht verfügbar\n' "$port" >> "$directory/unavailable.txt"
            curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:$port/_stats/request_cache,search" > "$directory/opensearch-$port-search.json" 2> "$directory/opensearch-$port-search.stderr" || printf 'OSindexstats %s nicht verfügbar\n' "$port" >> "$directory/unavailable.txt"
          done
      - name: Tatsächlichen Dienstrestart prüfen
        run: |
          docker compose restart shop
          docker compose up --detach --wait --wait-timeout 120
          docker compose exec shop /shop healthcheck
      - name: Vollständigen Compose-Gastkauf und persistenten Dienstrestart über HTTP prüfen
        env:
          SHOP_DEMO_PUBLIC_URL: http://127.0.0.1:8080
          SHOP_DEMO_BACKEND_URL: http://127.0.0.1:8081
          SHOP_DEMO_DEPLOYMENT: compose
        run: go test ./cucumber/demo -count=1
      - name: Sämtliches Gherkin ohne Verhaltensbehauptung parsen
        run: go test ./... -run '^TestFeatureSyntax$' -count=1
      - name: Native Packageermittlung, fachliches Verhalten und vollständige Coveragequote
        run: |
          packages="$(go list -f '{{if or .GoFiles .CgoFiles}}{{.ImportPath}}{{end}}' ./... | sed '/^$/d')"
          if [ -z "$packages" ]; then
            echo 'Bootstrap: keine buildfähigen Produktivpackages; produktive Coverage nicht anwendbar.'
            echo 'Syntaxprüfung belegt kein fachliches Verhalten.'
            exit 0
          fi
          printf 'Produktivpackages laut Go:\n%s\n' "$packages"
          mkdir -p "$SHOP_PROCESS_COVERDIR" /tmp/shop-merged-coverage
          go test -p 1 ./... -count=1 -coverpkg=./... -covermode=atomic -coverprofile=cover.out -args -test.gocoverdir="$SHOP_PROCESS_COVERDIR"
          go tool covdata merge -i="$SHOP_PROCESS_COVERDIR" -o=/tmp/shop-merged-coverage -pcombine
          go tool covdata textfmt -i=/tmp/shop-merged-coverage -o=cover.out
          go run github.com/vladopajic/go-test-coverage/v2@v2.19.0 --config=.testcoverage.yml
      - name: Nach Tests echte Ressourcen- und Dienstzustände sichern
        if: always()
        run: |
          directory=/tmp/shop-benchmark-results/resources/nach
          mkdir -p "$directory"
          date --utc --iso-8601=ns > "$directory/utc.txt"
          docker info --format '{"cpu":{{.NCPU}},"memoryBytes":{{.MemTotal}},"kernel":{{json .KernelVersion}},"os":{{json .OperatingSystem}}}' > "$directory/docker-host.json"
          free --bytes > "$directory/host-memory.txt"
          for pressure in cpu memory io; do
            cat "/proc/pressure/$pressure" > "$directory/host-$pressure-pressure.txt" 2>&1 || printf 'Nicht verfügbare Hostdiagnose: %s\n' "$pressure" >> "$directory/unavailable.txt"
          done
          docker compose ps -aq > /tmp/shop-diagnostic-current
          docker compose -p shop-benchmark -f compose.yml -f compose.benchmark.yml ps -aq >> /tmp/shop-diagnostic-current
          sort -u /tmp/shop-diagnostic-current -o /tmp/shop-diagnostic-current
          while read -r container; do
            docker inspect --format '{"id":{{json .Id}},"name":{{json .Name}},"status":{{json .State.Status}},"oomKilled":{{.State.OOMKilled}},"restarts":{{.RestartCount}},"exitCode":{{.State.ExitCode}},"health":{{json (index .State "Health")}},"started":{{json .State.StartedAt}},"finished":{{json .State.FinishedAt}},"nanoCPUs":{{.HostConfig.NanoCpus}},"cpuQuota":{{.HostConfig.CpuQuota}},"cpuPeriod":{{.HostConfig.CpuPeriod}},"memoryLimit":{{.HostConfig.Memory}}}' "$container" > "$directory/$container-state.json"
            process=$(docker inspect --format '{{.State.Pid}}' "$container")
            if [ "$process" -gt 0 ]; then
              for metric in cpu.stat memory.events memory.current memory.peak cpu.pressure memory.pressure; do
                if ! captured=$(sudo cat "/proc/$process/root/sys/fs/cgroup/$metric" 2>&1); then
                  printf 'Nicht verfügbare Containerdiagnose: %s/%s\n' "$container" "$metric" >> "$directory/unavailable.txt"
                fi
                printf '%s\n' "$captured" > "$directory/$container-$metric.txt"
              done
            fi
          done < /tmp/shop-diagnostic-current
          for port in 19200 29200; do
            curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:$port/_nodes/stats/indices,jvm,process,os,thread_pool" > "$directory/opensearch-$port-nodes.json" 2> "$directory/opensearch-$port-nodes.stderr" || printf 'OSnodes %s nicht verfügbar\n' "$port" >> "$directory/unavailable.txt"
            curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:$port/_stats/request_cache,search" > "$directory/opensearch-$port-search.json" 2> "$directory/opensearch-$port-search.stderr" || printf 'OSindexstats %s nicht verfügbar\n' "$port" >> "$directory/unavailable.txt"
          done
      - name: Eigene beobachtende Collectorprozesse auch nach Testfehlern beenden
        if: always()
        run: |
          for file in /tmp/shop-stats.pid /tmp/shop-demo-events.pid /tmp/shop-benchmark-events.pid /tmp/shop-host-processes.pid; do
            if [ -f "$file" ]; then
              process=$(cat "$file")
              if kill -0 -- "-$process" 2>/dev/null; then
                kill -- "-$process"
              fi
            fi
          done
      - name: Tatsächliche vollständige Lastwerte und Aussagegrenzen ausgeben
        if: always()
        run: |
          cat /tmp/shop-benchmark-results/demo-cold-start.json
          cat /tmp/shop-benchmark-results/benchmark-cold-start.json
          cat /tmp/shop-benchmark-results/measurement.json
      - name: Compose-Ausgabe sichern
        if: always()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ github.job }}
          path: /tmp/shop-benchmark-results
      - name: Isolierte Benchmarkausgabe sichern
        if: always()
        run: docker compose -p shop-benchmark -f compose.yml -f compose.benchmark.yml logs --no-color
      - name: Eigene Benchmarkdienste entfernen
        if: always()
        run: docker compose -p shop-benchmark -f compose.yml -f compose.benchmark.yml down --volumes
      - name: Eigene Testdienste entfernen
        if: always()
        run: docker compose down --volumes
  race:
    name: race
    runs-on: ubuntu-latest
    env:
      SHOP_TEST_POSTGRES_DSN: postgres://shop:local-demo-only@127.0.0.1:15432/shop?sslmode=disable
      SHOP_TEST_TEMPORAL_ADDRESS: 127.0.0.1:17233
      TEMPORAL_ADDRESS: 127.0.0.1:17233
      SHOP_TEST_OPENSEARCH_URL: http://127.0.0.1:19200
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Echte Hugo-/SSI-/ESI-Standardengines installieren
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends hugo nginx varnish sysstat
          hugo version
          nginx -v
          varnishd -V
      - name: Standardlastwerkzeug installieren
        run: GOBIN=/tmp/shop-standard-tools go install github.com/rakyll/hey@v0.1.5
      - name: Tatsächliche Compose-Laufzeit starten
        run: |
          mkdir -p /tmp/shop-benchmark-results
          started=$SECONDS
          docker compose up --detach --build --wait --wait-timeout 180
          elapsed=$((SECONDS - started))
          printf '{"boundary":"compose-command-start-to-all-services-healthy","seconds":%s,"resolutionSeconds":1,"includes":"image pull, build, content generation, seed import, health waits","freshProjectVolumes":true,"dataset":"4 Modelle / 8 Varianten","ordersAtStartup":0,"buildCache":"first build","fullPageRequestMeasurement":false}\n' "$elapsed" > /tmp/shop-benchmark-results/demo-cold-start.json
      - name: Isoliertes synthetisches Referenzprofil mit gleichem Build starten
        run: |
          mkdir -p /tmp/shop-benchmark-results
          started=$SECONDS
          docker compose -p shop-benchmark -f compose.yml -f compose.benchmark.yml up --detach --build --wait --wait-timeout 180
          elapsed=$((SECONDS - started))
          printf '{"boundary":"compose-command-start-to-all-services-healthy","seconds":%s,"resolutionSeconds":1,"includes":"image pull, build, content generation, seed import, health waits","freshProjectVolumes":true,"dataset":"30 synthetische Modelle / 90 Varianten","ordersAtStartup":0,"buildCache":"shared image build cache from demo","fullPageRequestMeasurement":false}\n' "$elapsed" > /tmp/shop-benchmark-results/benchmark-cold-start.json
      - name: Beobachtende Ressourcenzeitreihen für beide eigenen Projekte starten
        run: |
          mkdir -p /tmp/shop-benchmark-results/resources
          docker compose ps -aq > /tmp/shop-diagnostic-containers
          docker compose -p shop-benchmark -f compose.yml -f compose.benchmark.yml ps -aq >> /tmp/shop-diagnostic-containers
          sort -u /tmp/shop-diagnostic-containers -o /tmp/shop-diagnostic-containers
          mapfile -t containers < /tmp/shop-diagnostic-containers
          setsid bash -c "docker stats --format '{{json .}}' \"\$@\" | while IFS= read -r sample; do printf '{\"utc\":\"%s\",\"sample\":%s}\\n' \"\$(date --utc --iso-8601=ns)\" \"\$sample\"; done" collector "${containers[@]}" > /tmp/shop-benchmark-results/resources/container-stats.jsonl 2> /tmp/shop-benchmark-results/resources/container-stats.stderr &
          echo "$!" > /tmp/shop-stats.pid
          setsid docker events --filter type=container --filter label=com.docker.compose.project=shop --format '{{json .}}' > /tmp/shop-benchmark-results/resources/demo-events.jsonl 2> /tmp/shop-benchmark-results/resources/demo-events.stderr &
          echo "$!" > /tmp/shop-demo-events.pid
          setsid docker events --filter type=container --filter label=com.docker.compose.project=shop-benchmark --format '{{json .}}' > /tmp/shop-benchmark-results/resources/benchmark-events.jsonl 2> /tmp/shop-benchmark-results/resources/benchmark-events.stderr &
          echo "$!" > /tmp/shop-benchmark-events.pid
          setsid timeout 1500s pidstat -H -h -r -u -p ALL 1 > /tmp/shop-benchmark-results/resources/host-processes.txt 2> /tmp/shop-benchmark-results/resources/host-processes.stderr &
          echo "$!" > /tmp/shop-host-processes.pid
          ps -eo pid,ppid,comm > /tmp/shop-benchmark-results/resources/process-tree-before.txt
          printf 'pidstat -H: UTC Unixzeit; CPU100 entspricht einem Kern. Nur Prozessnamen, keine Argumente. PPID-Zuordnung aus separaten Snapshots; kurze Prozesse und Samplinglücken bleiben unbelegt. Beobachtung läuft in beiden Phasen und verursacht Aufwand.\n' > /tmp/shop-benchmark-results/resources/host-process-boundary.txt
          printf 'Mitlaufende Standard-Dockerbeobachtung verursacht zusätzlichen Diagnoseaufwand. UTC je Statszeile ist Empfangszeit, kein exakter CPU-Intervallbeginn. Snapshots vor/nach der gesamten Suite erlauben keine isolierte Routenzuordnung. Fehlende Dateien/Fehler sind fehlende Diagnosen, keine Nullwerte.\n' > /tmp/shop-benchmark-results/resources/measurement-boundary.txt
      - name: Vor Tests echte Ressourcen- und Dienstzustände sichern
        if: always()
        run: |
          directory=/tmp/shop-benchmark-results/resources/vor
          mkdir -p "$directory"
          date --utc --iso-8601=ns > "$directory/utc.txt"
          docker info --format '{"cpu":{{.NCPU}},"memoryBytes":{{.MemTotal}},"kernel":{{json .KernelVersion}},"os":{{json .OperatingSystem}}}' > "$directory/docker-host.json"
