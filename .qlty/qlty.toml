config_version = "0"

exclude_patterns = [
  "**/.git/**",
  "**/node_modules/**",
  "**/vendor/**",
  "**/dist/**",
  "**/coverage/**",
]

test_patterns = [
  "cucumber/**",
  "spec/features/**",
  "**/*_test.go",
]

[smells]
mode = "block"

[smells.nested_control_flow]
# Qlty meldet ab einschließlich Schwelle: zwei Ebenen erlaubt, dritte verboten.
threshold = 3

[smells.function_parameters]
threshold = 5

[smells.return_statements]
threshold = 6

[smells.file_complexity]
threshold = 50

[smells.function_complexity]
threshold = 15

[smells.identical_code]
threshold = 12

[smells.similar_code]
threshold = 12

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"
mode = "block"

[[plugin]]
name = "ast-grep"
mode = "block"
config_files = ["sgconfig.yml"]

[[plugin]]
name = "gitleaks"
mode = "block"

[[plugin]]
name = "gofmt"
mode = "block"

[[plugin]]
name = "golangci-lint"
mode = "block"
config_files = [".qlty/configs/.golangci.yml"]

[[plugin]]
name = "osv-scanner"
mode = "block"

[[plugin]]
name = "shop-go-type-declaration-spacing"
mode = "block"

[plugins.definitions.shop-go-type-declaration-spacing]
runtime = "go"
# Das mit Go gebündelte Werkzeug stellt die Qlty-Runtime ohne Fremdpaket bereit.
package = "gofmt"
known_good_version = "1.0.0"
file_types = ["go"]
affects_cache = [".qlty/checks/type-spacing/**"]
description = "Prüft die Trennung echter Top-Level-Typ-, Funktions- und Methodendeklarationen mit dem Go-Parser."
environment = [
  { name = "GO111MODULE", value = "off" },
  { name = "GOCACHE", value = "${cachedir}/go-build" },
]

[plugins.definitions.shop-go-type-declaration-spacing.drivers.lint]
script = '''
shop_root="$PWD"
while [ ! -f "$shop_root/.qlty/qlty.toml" ]; do
  shop_root="${shop_root%/*}"
  [ -n "$shop_root" ] || exit 2
done
go run "$shop_root/.qlty/checks/type-spacing"/*.go -- ${target}
'''
success_codes = [0]
output = "stdout"
output_format = "regex"
output_missing = "parse"
output_level = "high"
output_regex = "(?P<path>.*):(?P<line>\\d+):(?P<col>\\d+): (?P<code>\\S+) (?P<message>.+)"
batch = true
cache_results = false

[plugins.definitions.shop-go-type-declaration-spacing.drivers.regression]
script = '''
shop_root="$PWD"
while [ ! -f "$shop_root/.qlty/qlty.toml" ]; do
  shop_root="${shop_root%/*}"
  [ -n "$shop_root" ] || exit 2
done
go run "$shop_root/.qlty/checks/type-spacing"/*.go --regression "$shop_root/.qlty/checks/type-spacing/fixtures.json"
'''
success_codes = [0]
output = "pass_fail"
batch = true
cache_results = false

[plugins.definitions.golangci-lint.drivers.spacing-regression]
script = '''
shop_root="$PWD"
while [ ! -f "$shop_root/.qlty/qlty.toml" ]; do
  shop_root="${shop_root%/*}"
  [ -n "$shop_root" ] || exit 2
done
sh "$shop_root/.qlty/checks/statement-spacing/regression.sh"
'''
success_codes = [0]
output = "pass_fail"
batch = true
cache_results = false


[plugins.definitions.ast-grep]
affects_cache = [".qlty/ast-grep/**", ".qlty/ast-grep-test/**", "sgconfig.yml"]

[plugins.definitions.ast-grep.drivers.regression]
script = "ast-grep test --skip-snapshot-tests"
success_codes = [0]
output = "pass_fail"
batch = true
cache_results = false

[plugins.definitions.ast-grep.drivers.lint]
success_codes = [0, 1]
