version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - nilerr
    - nlreturn
    - staticcheck
    - unused
    - wastedassign
    - wsl_v5
  settings:
    nlreturn:
      block-size: 2
    wsl_v5:
      default: none
      enable:
        - after-block
        - leading-whitespace
        - trailing-whitespace

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  path-mode: abs
