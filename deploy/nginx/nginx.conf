worker_processes 1;
pid /tmp/shop-nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    include mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    client_body_temp_path /tmp/shop-nginx-client;
    proxy_temp_path /tmp/shop-nginx-proxy;
    fastcgi_temp_path /tmp/shop-nginx-fastcgi;
    uwsgi_temp_path /tmp/shop-nginx-uwsgi;
    scgi_temp_path /tmp/shop-nginx-scgi;
    server {
        listen 8082;
        server_name localhost;
        root /srv/shop/web;
        ssi on;
        ssi_silent_errors off;
        location = /de-DE/ { try_files /index.html =404; add_header Cache-Control "public,max-age=3600"; }
        location = /de-DE/service { try_files /de-DE/service/index.html =404; add_header Cache-Control "public,max-age=3600"; }
        location = /de-DE/marken { try_files /de-DE/marken/index.html =404; add_header Cache-Control "public,max-age=3600"; }
        location /_frame/ { internal; }
        location /_static/ { internal; add_header Cache-Control "public,max-age=3600"; }
        location /backend { return 404; }
        location / {
            proxy_pass http://shop:8080;
            proxy_set_header X-Shop-Composition 1;
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "";
            proxy_connect_timeout 150ms;
            proxy_read_timeout 3s;
        }
    }
}
